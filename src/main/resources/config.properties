local.testdata=src/main/resources/testdata.xlsx

# Used by CaseRunLookup only. Override with TESTRAIL_BASE_URL or -Dtestrail.url.
# A trailing /index.php is tolerated and stripped.
testrail.url=https://tiket.testrail.com

# CaseRunLookup: API cases are grouped by TestRail section, so expanding one needs the
# project that owns the API suite. Override with -D, env vars, or the CLI flags.
caselookup.testrail.projectId=162
caselookup.testrail.apiSuiteId=4710

# CaseRunLookup: TestRail's vertical names the APP Klov projects ("APP Flight PREPROD
# ANDROID") but not the others. Web and panel suites use an abbreviated code with a
# -Web-Regression or -Panel-Regression suffix, and the API projects add " - Client
# Facing", so "Accommodation" has to be told about "AC-Panel-Regression" and about the
# misspelled "ACCOMODATION - Client Facing".
#
# Each entry lists vertical segments to search in addition to the derived name, comma
# separated. The platform prefix, environment and platform suffix are still added, so a
# segment only has to name the middle. An entry that matches no project costs one cheap
# lookup and is then ignored, which is why both the web and panel codes can be listed
# against a vertical whatever platform the case turns out to be on.
caselookup.klovAlias.Accommodation=AC-Web-Regression,AC-Panel-Regression
caselookup.klovAlias.Eiffel=EIFFEL-Web-Regression,EIFFEL-Panel-Regression
caselookup.klovAlias.Flight=FLG-Web-Regression,FLG-Panel-Regression
caselookup.klovAlias.Grand=GRAND-Web-Regression,GRAND-Panel-Regression
caselookup.klovAlias.Liberty=LIBERTY-Web-Regression,LIBERTY-Panel-Regression
caselookup.klovAlias.Promo=PROMO-Web-Regression,PROMO-Panel-Regression
caselookup.klovAlias.Sphinx=SPHINX-Web-Regression,SPHINX-Panel-Regression
caselookup.klovAlias.TTD=TTD-Web-Regression,TTD-Panel-Regression
caselookup.klovAlias.GT=GT-Web-Regression,GT-Panel-Regression
caselookup.klovAlias.Pricing=PRCNG-Panel-Regression

# The API Klov projects are named on their own, with no prefix or suffix, so they are
# keyed apart. These are not optional convenience entries. Every vertical also has a
# bare project ("Flight", "Sphinx", "Eiffel") that the exact-name match finds first and
# which stopped receiving runs in May 2026, so without the alias an API lookup searches
# a dead project and reports "never ran in range" while the live " - Client Facing"
# twin holds thousands of runs.
caselookup.klovAlias.api.Accommodation=ACCOMODATION - Client Facing
caselookup.klovAlias.api.Eiffel=Eiffel - Client Facing
caselookup.klovAlias.api.Flight=Flight - Client Facing
caselookup.klovAlias.api.Grand=Grand - Client Facing
caselookup.klovAlias.api.Liberty=Liberty - Client Facing
caselookup.klovAlias.api.Sphinx=Sphinx - Client Facing,Sphinx-CFD
caselookup.klovAlias.api.TTD=TTD - Client Facing
caselookup.klovAlias.api.GT=Ground Transport (NFT) - Client Facing
# B2B is the TestRail section, not the vertical. Cases under it carry Affiliate or
# Corporate (confirmed on C1876345 and C1881179), and their API projects are prefixed
# B2B_ with nothing to derive that from. B2B is kept as a vertical too, because the
# APP B2B PREPROD projects exist and some app case must be reporting to them.
caselookup.klovAlias.api.Affiliate=B2B_Affiliate_API
caselookup.klovAlias.api.Corporate=B2B_Corporate
caselookup.klovAlias.api.B2B=B2B_Affiliate_API,B2B_Corporate
# Promo and Pricing need no entry: the bare project is the live one.

# Affiliate and Corporate are confirmed verticals, from C1876345 (Panel Test Cases >
# B2B > Affiliate, vertical Affiliate) and C1881179 (Dweb Test Cases > B2B > Corporate,
# vertical Corporate).
caselookup.klovAlias.Affiliate=AF-Panel-Regression
caselookup.klovAlias.Corporate=CRP-Panel-Regression,CRP-Web-Regression
# CFD is the central finance dashboard, confirmed on C1884092, whose platform reads
# "Dashboard Panel" and resolves to the panel family.
caselookup.klovAlias.CFD=CFD-Panel-Regression

